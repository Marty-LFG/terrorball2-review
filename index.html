<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>TerrorBall 2</title>

    <!-- viewport-fit=cover so the canvas reaches under notches; no user scaling, or a
         double-tap on mobile zooms the page instead of tapping the ball. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2b0f26">

    <style>
      :root {
        --plum-deep: #2b0f26;
        --plum-panel: #6e3d6e;
        --green: #2be02b;
        --lavender: #a08fb0;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--plum-deep);
        /* Stops mobile browsers hijacking drags as scroll/pull-to-refresh, which otherwise
           swallows taps meant for the game. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Fills the window at any aspect. The game letterboxes itself: the camera frames the
         level's own bounds, so extra space becomes border rather than cropped playfield. */
      #unity-container {
        position: fixed;
        inset: 0;
        display: block;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--plum-deep);
        outline: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--plum-deep);
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.4s ease;
      }

      #loading.done { opacity: 0; pointer-events: none; }

      #loading h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 44px);
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--green);
      }

      #loading h1 span { color: #3fe0e6; }

      /* Hard-edged bar, matching the game's flat geometry - no rounded corners anywhere. */
      #bar {
        width: min(60vw, 320px);
        height: 10px;
        background: rgba(160, 143, 176, 0.22);
      }

      #bar-fill {
        width: 0%;
        height: 100%;
        background: var(--green);
        transition: width 0.15s linear;
      }

      #pct {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.22em;
        color: var(--lavender);
      }

      #error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: var(--lavender);
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
    <style>
      #tb2-bar {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 10;
        display: flex;
        gap: 14px;
        align-items: baseline;
        padding: 6px 12px;
        background: #200B1D;
        color: #A08FB0;
        font: 500 11px/1.4 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #tb2-feedback { color: #2BE02B; text-decoration: none; border-bottom: 1px solid #2BE02B; }
      #tb2-id { color: #CC7F4C; font-variant-numeric: tabular-nums; }
      #tb2-note { margin-left: auto; opacity: 0.55; text-transform: none; letter-spacing: 0.02em; }
      @media (max-width: 520px) { #tb2-note { display: none; } }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="loading">
      <h1>Terror<span>ball</span> 2</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <p id="pct">LOADING 0%</p>
    </div>

    <div id="error"></div>

    <!--
      Deliberately real DOM outside the canvas rather than UI inside the game.
      Application.OpenURL from a WebGL canvas is routinely popup-blocked, because the click does not
      look like a user gesture on a link; an anchor in the page never is. It is also visible while
      the game is still loading, which is when an impatient tester is most likely to want it.
    -->
    <div id="tb2-bar">
      <a id="tb2-feedback" href="#" target="_blank" rel="noopener" hidden>Give feedback</a>
      <span id="tb2-id" title="Quote this in the feedback form so your notes can be matched to your session."></span>
      <span id="tb2-note">Anonymous play data (levels, deaths, timings) is recorded.</span>
    </div>

    <script>
      // ---- Telemetry delivery ---------------------------------------------------------------
      // Unity queues batches through the TB2_* jslib bridge; this owns getting them out.
      //
      // sendBeacon is the only transport designed to survive page unload - fetch and XHR are both
      // cancelled when the document goes away, which is precisely when the most valuable event of
      // all (the tester giving up and closing the tab) is emitted.
      //
      // text/plain keeps the POST a CORS *simple request*: no preflight, so the receiving endpoint
      // needs no CORS configuration. application/json would trigger an OPTIONS that a Google Apps
      // Script web app does not answer.
      (function () {
        // ---------------------------------------------------------------------------------
        // SET THESE TWO, then redeploy. Both are safe to leave empty:
        //   ENDPOINT empty -> nothing is transmitted; the game still records locally and the
        //                     end-of-run screen still shows a copyable session blob.
        //   FEEDBACK empty -> the feedback link stays hidden rather than dangling.
        //
        // ENDPOINT wants a Google Apps Script web app deployed as "execute as me / anyone", whose
        // doPost appends JSON.parse(e.postData.contents) to a sheet. About fifteen lines.
        // ---------------------------------------------------------------------------------
        var ENDPOINT = "";
        var FEEDBACK = "";
        window.TB2 = window.TB2 || {};
        window.TB2.pending = window.TB2.pending || [];

        window.TB2.flush = function () {
          if (!ENDPOINT || !window.TB2.pending.length) return;
          var payload = '{"batches":[' + window.TB2.pending.join(",") + ']}';
          try {
            if (navigator.sendBeacon &&
                navigator.sendBeacon(ENDPOINT, new Blob([payload], { type: "text/plain" }))) {
              window.TB2.pending = [];
            }
          } catch (e) {
            // Keep the events queued and try again at the next boundary rather than losing them.
            console.warn("telemetry flush failed", e);
          }
        };

        window.TB2.showId = function (pid) {
          var el = document.getElementById("tb2-id");
          if (el) el.textContent = "ID " + pid;
        };

        // Only show the link if it goes somewhere. A dead "Give feedback" is worse than none.
        var link = document.getElementById("tb2-feedback");
        if (link && FEEDBACK) { link.href = FEEDBACK; link.hidden = false; }

        // Nothing is transmitted when no endpoint is set, so do not claim otherwise.
        var note = document.getElementById("tb2-note");
        if (note && !ENDPOINT) note.textContent = "";

        // pagehide, not unload: unload does not fire reliably on mobile Safari, which is a large
        // slice of "played it on my phone". visibilitychange catches the tab being backgrounded,
        // which on mobile is usually the last thing that happens before it is discarded.
        window.addEventListener("pagehide", window.TB2.flush);
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") window.TB2.flush();
        });
      })();

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebPlaytest.data.unityweb",
        frameworkUrl: buildUrl + "/WebPlaytest.framework.js.unityweb",
        codeUrl: buildUrl + "/WebPlaytest.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Lightning Forge Games",
        productName: "TerrorBall 2",
        productVersion: "a7b908f",
        // Let the canvas follow its CSS size instead of a fixed backing-store size, so
        // rotating a phone or resizing a window reflows rather than stretching.
        matchWebGLToCanvasSize: true
      };

      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var barFill = document.querySelector("#bar-fill");
      var pct = document.querySelector("#pct");
      var errorBox = document.querySelector("#error");

      function showError(message) {
        loading.style.display = "none";
        errorBox.style.display = "flex";
        errorBox.textContent = message;
      }

      // Cap the backing store on mobile. Some phones report a devicePixelRatio of 3-4, and a
      // full-resolution WebGL surface at that size costs far more than it gains here - the art
      // is flat colour with no fine detail.
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/WebPlaytest.loader.js";
      script.onerror = function () {
        showError("Could not load the game files. If you are viewing this from a local file, it needs to be served over http.");
      };
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percent = Math.round(progress * 100);
          barFill.style.width = percent + "%";
          pct.textContent = "LOADING " + percent + "%";
        }).then(function () {
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 450);
          canvas.focus();
        }).catch(function (message) {
          showError(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
